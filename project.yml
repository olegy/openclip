name: OpenClip
options:
  bundleIdPrefix: com.openclip
  developmentLanguage: en
  knownRegions: [en, Base, zh-Hans, zh-Hant, fr, ja]
targets:
  Core:
    type: framework
    platform: macOS
    deploymentTarget: "14.0"
    sources: [Sources/Core]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: true
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
  OpenClip:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources: [Sources/OpenClip]
    info:
      path: Sources/OpenClip/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.openclip.url
            CFBundleURLSchemes:
              - openclip
              - openclip-dev
        CFBundleDocumentTypes:
          - CFBundleTypeName: OpenClip Extension
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.openclip.extension
            LSTypeIsPackage: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.openclip.extension
            UTTypeDescription: OpenClip Extension
            UTTypeConformsTo:
              - com.apple.package
              - public.composite-content
            UTTypeTagSpecification:
              public.filename-extension:
                - openclipext
        LSUIElement: true
        NSHumanReadableCopyright: "Copyright © 2026 Ganesh M and OpenClip Contributors. AGPL-3.0 licensed."
        NSAppleEventsUsageDescription: "OpenClip needs to control other apps to run your AppleScript actions and to paste results back into the app you were using."
        # Lite's own feed and Ed25519 key (scripts/release.sh). Never upstream's: Sparkle would
        # replace this build with an upstream release.
        SUFeedURL: https://github.com/olegy/openclip/releases/latest/download/appcast.xml
        SUPublicEDKey: dFBKKIVeP3Of0PU6uDiPtMReKpBnNNQhZ2trdQBf0Dc=
        # Sparkle checks once a day without asking, never downloads on its own, and offers no
        # "install automatically" checkbox: an update installs only from the user's click.
        SUScheduledCheckInterval: 86400
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
        SUAllowsAutomaticUpdates: false
        CFBundleLocalizations:
          - en
          - zh-Hans
          - zh-Hant
          - fr
          - ja
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # OpenClip Lite: the upstream version it is based on plus a Lite revision, e.g. 1.8.2-lite.1.
        # Xcode takes CFBundleShortVersionString from MARKETING_VERSION itself (the INFOPLIST_KEY_
        # line below has no effect), so the suffix has to live here. SemanticVersion ignores it, so
        # extension minOpenClipVersion checks still compare against the upstream triplet.
        # CFBundleVersion is what Sparkle compares: the upstream build plus the Lite revision
        # (23.5, 23.6, … then 24.1 on the next upstream base), so it always grows.
        OPENCLIP_UPSTREAM_BUILD: "26"
        OPENCLIP_LITE_REVISION: "4"
        MARKETING_VERSION: "1.9.2-lite.$(OPENCLIP_LITE_REVISION)"
        CURRENT_PROJECT_VERSION: "$(OPENCLIP_UPSTREAM_BUILD).$(OPENCLIP_LITE_REVISION)"
        INFOPLIST_KEY_CFBundleShortVersionString: $(MARKETING_VERSION)
        INFOPLIST_KEY_CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Sources/OpenClip/OpenClip.entitlements
        PRODUCT_MODULE_NAME: OpenClip
        # Ad-hoc is the default so a clone builds and runs with no Apple Developer account.
        # scripts/sign_artifact.sh overrides the identity for signed/notarized builds.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: true
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.olegy.openclip.dev
          INFOPLIST_KEY_CFBundleDisplayName: OpenClip Dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.olegy.openclip
          INFOPLIST_KEY_CFBundleDisplayName: OpenClip
    dependencies:
      - target: Core
      - package: OpenSelection
      - package: KeyboardShortcuts
      - package: SDWebImageSwiftUI
      - package: SDWebImageSVGCoder
      - package: Sparkle
  OpenClipTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources: [Tests/OpenClipTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - target: OpenClip
      - package: OpenSelection
packages:
  OpenSelection:
    url: https://github.com/ganeshmshetty/OpenSelection.git
    exactVersion: 2.15.3
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.1.0
  SDWebImageSwiftUI:
    url: https://github.com/SDWebImage/SDWebImageSwiftUI
    from: 3.0.0
  SDWebImageSVGCoder:
    url: https://github.com/SDWebImage/SDWebImageSVGCoder
    from: 1.7.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.4
